    <!-- Header -->
    <header class="glass-panel sticky top-0 z-40 w-full border-b border-slate-800/60 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-brand to-cyan-400 flex items-center justify-center shadow-lg shadow-brand/20 animate-pulse">
                <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">vLLM Suite Dashboard</h1>
                <p class="text-xs text-slate-400">Panel de Control y Orquestación Local de Modelos</p>
            </div>
        </div>
        
        <!-- Refresh status, User badge & Logout -->
        <div class="flex items-center gap-3 text-sm">
            <span id="last-update" class="text-slate-500 font-mono text-xs hidden sm:inline">Cargando...</span>
            <button onclick="refreshData()" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all flex items-center gap-1.5 border border-slate-700/50 text-xs">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.2" />
                </svg>
                Actualizar
            </button>

            {% if current_user %}
            <div class="h-5 w-px bg-slate-800 hidden sm:block"></div>
            <div class="flex items-center gap-2 pl-1">
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700/60 text-xs">
                    <span class="h-2 w-2 rounded-full {{ 'bg-emerald-400' if current_user.is_local else 'bg-sky-400' }}"></span>
                    <span class="font-medium text-slate-200">{{ current_user.username }}</span>
                    <span class="text-[10px] text-slate-400 font-mono uppercase">({{ current_user.role }})</span>
                </div>
                <a href="{{ url_for('auth_bp.logout') }}" title="Cerrar Sesión" class="p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all flex items-center justify-center">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
            {% endif %}
        </div>
    </header>
